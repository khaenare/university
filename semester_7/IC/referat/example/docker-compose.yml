# Приклад до реферату: алертинг у Prometheus + Alertmanager для СУБД PostgreSQL.
# Запуск: docker compose up -d
#   Prometheus   — http://localhost:9090/alerts
#   Alertmanager — http://localhost:9093
name: alerting-demo

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo          # лише для локального прикладу
    # Малий ліміт підключень, щоб легко показати алерт «забагато підключень»
    command: ["postgres", "-c", "max_connections=20"]
    volumes:
      - pg-data:/var/lib/postgresql/data

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_URI: postgres:5432/demo?sslmode=disable
      DATA_SOURCE_USER: demo
      DATA_SOURCE_PASS: demo
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager   # тиші (silences) переживають перезапуск

  # Приймач webhook-сповіщень: друкує кожне сповіщення в лог контейнера
  webhook:
    image: python:3.12.16-slim-trixie
    command: ["python", "-u", "/app/receiver.py"]
    volumes:
      - ./webhook:/app:ro

volumes:
  pg-data:
  prometheus-data:
  alertmanager-data:

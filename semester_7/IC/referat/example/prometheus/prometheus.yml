global:
  scrape_interval: 5s
  evaluation_interval: 5s      # як часто перевіряються правила алертів

# Куди надсилати алерти
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Файли з правилами алертів
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

# Шлюз системи: кожен запит до Grafana і Prometheus спершу перевіряється
# сервером авторизації (модуль auth_request). Без дійсної сесії — редирект на вхід.

# Вбудований DNS Docker. Адреси сервісів перечитуються кожні 10 с, тому
# шлюз працює й після перестворення контейнера (у нього може змінитися IP).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream auth_srv {
    zone auth_srv 64k;
    server auth:5000 resolve;
}

upstream grafana_srv {
    zone grafana_srv 64k;
    server grafana:3000 resolve;
}

upstream prometheus_srv {
    zone prometheus_srv 64k;
    server prometheus:9090 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Відносні редиректи, щоб не втрачався зовнішній порт (8080)
    absolute_redirect off;

    # Внутрішній підзапит перевірки сесії (ззовні недоступний)
    location = /_verify {
        internal;
        proxy_pass http://auth_srv/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Перевірка сесії доступна лише як внутрішній підзапит /_verify
    location = /auth/verify {
        return 404;
    }

    # Сторінки входу та виходу — доступні без авторизації
    location /auth/ {
        proxy_pass http://auth_srv;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Заборона вбудовувати сторінку входу в чужі сайти (захист від clickjacking)
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Веб-інтерфейс Prometheus
    location /prometheus/ {
        auth_request /_verify;
        error_page 401 = @login;
        proxy_pass http://prometheus_srv/;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # Grafana: логін і роль користувача передаються заголовками (auth proxy).
    # Заголовки завжди перезаписуються тут, тому підробити їх з браузера неможливо.
    location / {
        auth_request /_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_role $upstream_http_x_auth_role;
        error_page 401 = @login;

        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana_srv;
    }

    # $request_uri передається як є (закодованим), тому символи переводу рядка
    # з адреси не можуть потрапити в заголовки відповіді
    location @login {
        return 302 /auth/login?next=$request_uri;
    }
}

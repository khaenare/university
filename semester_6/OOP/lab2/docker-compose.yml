services:
  db:
    image: postgres:17-alpine
    container_name: lab2-periodicals-db
    environment:
      POSTGRES_DB: periodicals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d periodicals"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: lab2-periodicals-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/periodicals
      JWT_SECRET: lab2-dev-secret
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: lab2-periodicals-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:

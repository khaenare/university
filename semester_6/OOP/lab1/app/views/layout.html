<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Періодичні видання</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/publications">
      <span class="brand-mark">Ж</span>
      <span>
        <strong>Periodicals Hub</strong>
        <small>каталог періодичних видань</small>
      </span>
    </a>
    <nav class="nav">
      {% if user %}
        <a href="/publications">Каталог</a>
        <a href="/subscriptions">Передплати</a>
        <a href="/payment">Платежі</a>
        <span class="user-pill">{{ user.username }} · {{ user.role }}</span>
        <a class="btn btn-ghost" href="/logout">Вийти</a>
      {% else %}
        <span class="user-pill">Гість</span>
      {% endif %}
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>

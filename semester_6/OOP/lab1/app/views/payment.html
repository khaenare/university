{% extends "layout.html" %}
{% block content %}
<h2>Реєстрація платежу</h2>
<form method="post" action="/payment/create">
  <label>ID передплати <input name="subscription_id" type="number" min="1" value="{{ subscription_id }}" required></label>
  <label>Сума <input name="amount" type="number" step="0.01" min="0" required></label>
  <button>Зареєструвати платіж</button>
</form>
{% if payments %}
<h3>Платежі</h3>
<table>
  <tr><th>ID</th><th>Сума</th><th>Статус</th><th>Дії</th></tr>
  {% for p in payments %}
  <tr>
    <td>{{ p.id }}</td><td>{{ p.amount }}</td><td>{{ p.status }}</td>
    <td>
      <form method="post" action="/payment/update" class="inline">
        <input type="hidden" name="payment_id" value="{{ p.id }}">
        <input name="status" value="{{ p.status }}">
        <button>Оновити</button>
      </form>
      <form method="post" action="/payment/delete" class="inline">
        <input type="hidden" name="payment_id" value="{{ p.id }}">
        <button>Видалити</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endif %}
{% endblock %}
